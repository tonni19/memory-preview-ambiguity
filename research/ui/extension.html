<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Expanded boundary preview</title><style>body{font:17px/1.5 system-ui;max-width:44rem;margin:2rem auto;padding:1rem;color:#17382d}label{display:block;margin:.5rem 0}select,input,button{font:inherit}fieldset{margin:1rem 0}output{font-weight:bold}</style><main><a href="/">Back to diagnostic</a><h1>Test an expanded rule</h1><p>Fictional explicit preference for warm lighting in the original room. Try a handoff to a second person or test the expiry boundary on day seven.</p><form><fieldset><legend>Rule for this event</legend>
<label><input id="recall" type="checkbox" checked> Allow factual recall</label><label>Recommendation scope <select id="rec"><option>task</option><option>none</option><option>person</option></select></label><label>Explicit preference scope <select id="pref"><option>task</option><option>none</option><option>person</option></select></label><label><input id="expiry" type="checkbox" checked> Expire from day seven</label><label><input id="delegate" type="checkbox"> Allow a handoff for the original task to the designated second person</label><label><input id="follow" type="checkbox"> Allow a follow-up on the original task</label></fieldset><fieldset><legend>Hypothetical request</legend><label>Person <select id="person"><option>self</option><option>other</option></select></label><label>Task <select id="task"><option>original</option><option>different</option></select></label><label>Purpose <select id="purpose"><option>recommendation</option><option>recall</option><option>preference</option><option>follow-up</option><option>handoff</option><option>trait</option></select></label><label>Day since the event <input id="day" type="number" min="0" step="1" value="0" required></label></fieldset><button>Test use</button> <output aria-live="polite"></output></form></main><script type="module">const g=id=>document.getElementById(id);document.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const rule={recall:g('recall').checked,rec:g('rec').value,pref:g('pref').value,expires:g('expiry').checked?7:null,delegate:g('delegate').checked,follow:g('follow').checked};const c={person:g('person').value,task:g('task').value,purpose:g('purpose').value,day:g('day').valueAsNumber};const r=await fetch('/expanded',{method:'POST',body:JSON.stringify({rule,c})});document.querySelector('output').textContent=r.ok?(await r.json()).outcome:'Unsupported rule. Recall must be on for recommendations, handoff and follow-up. A rule with no use has no expiry.'}</script></html>
