<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Preview diagnostic</title><style>body{font:18px/1.5 system-ui;color:#173a34;max-width:42rem;margin:5vh auto;padding:1.3rem}button,select{font:inherit;padding:.55rem;margin:.3rem}article{border:1px solid #b3c9c2;padding:1.25rem;border-radius:8px}</style><main><h1>Test a memory boundary</h1><p><a href="/workshop">Open the memory editor</a> · <a href="/extended">Test an expanded rule</a></p><label>Fictional event <select id="case"><option value="desk">A temporary workspace</option><option value="lighting">A stated lighting preference</option></select></label><p id="event"></p><article aria-live="polite"><h2 id="count"></h2><p id="question"></p><button id="allow">Allow this use</button><button id="block">Block this use</button></article><button id="undo">Undo last answer</button></main><script type="module">
const get=id=>document.getElementById(id); let history=[],next;
async function render(){for(const b of document.querySelectorAll('button,select'))b.disabled=true;
try{const response=await fetch('/preview',{method:'POST',body:JSON.stringify({id:get('case').value,history})}); if(!response.ok)throw Error('Could not load preview');const s=await response.json();next=s.next;get('event').textContent=s.event;get('count').textContent=s.remaining+' compatible '+(s.remaining===1?'rule':'rules');get('question').textContent=next?'Should the assistant '+({recall:'recall this event',recommendation:'use this event for a recommendation',preference:'treat this event as a lasting preference',trait:'infer a personality trait from this event'}[next.probe.purpose])+' for '+(next.probe.person==='self'?'you':'another person')+' in the task “'+next.probe.task+'”? Allow leaves '+next.allow+' rules. Block leaves '+next.block+'.':'Your answers identify one rule.';get('allow').disabled=get('block').disabled=!next;}catch(e){get('question').textContent=e.message;}finally{get('case').disabled=false;get('undo').disabled=!history.length;}}
for(const id of ['allow','block'])get(id).onclick=()=>{history.push({index:next.index,allowed:id==='allow'});render()};get('undo').onclick=()=>{history.pop();render()};get('case').onchange=()=>{history=[];render()};render();</script></html>
